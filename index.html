<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cloudstockproject</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1a1a1a;color:#fff;font-family:sans-serif;z-index:9999;">
      <img src="/src/assets/logos/logo_cloudstock_white.png" alt="CloudStock" style="height:90px;width:auto;object-fit:contain;margin-bottom:16px;" />
      <p style="margin:0;opacity:.6;">Carregando<span class="splash-dots"><span>.</span><span>.</span><span>.</span></span></p>
    </div>
    <style>
      @keyframes splashDot {
        0%, 60%, 100% { opacity: 0.15; }
        30% { opacity: 1; }
      }
      .splash-dots span {
        display: inline-block;
        animation: splashDot 1.4s infinite;
      }
      .splash-dots span:nth-child(2) { animation-delay: 0.2s; }
      .splash-dots span:nth-child(3) { animation-delay: 0.4s; }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
